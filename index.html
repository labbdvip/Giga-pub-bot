<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Earn App</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#eef7f1;
}
header{
  padding:16px;
  font-size:22px;
  font-weight:bold;
}
.card{
  background:#fff;
  margin:16px;
  padding:20px;
  border-radius:20px;
  box-shadow:0 8px 20px rgba(0,0,0,.08);
}
button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:30px;
  background:#2f7d57;
  color:#fff;
  font-size:16px;
  margin-top:10px;
}
nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#fff;
  display:flex;
  justify-content:space-around;
  padding:10px 0;
  box-shadow:0 -4px 12px rgba(0,0,0,.1)
}
nav div{
  text-align:center;
  font-size:12px;
}
section{display:none}
section.active{display:block}
</style>

</head>
<body>

<header>Earn App</header>

<!-- DASHBOARD -->
<section id="dashboard" class="active">

  <div class="card">
    <h3>Balance</h3>
    <h1 id="balance">0.00</h1>
  </div>

  <div class="card">
    <h3>Telegram Tasks</h3>
    <div id="tgTasks">Loading...</div>
  </div>

</section>

<!-- ADS -->
<section id="ads">
  <div class="card">
    <h3>Watch Ads</h3>
    <button onclick="watchAd()">Watch Ad</button>
  </div>
</section>

<!-- WITHDRAW -->
<section id="withdraw">
  <div class="card">
    <h3>Withdraw</h3>
    <p>Coming soon</p>
  </div>
</section>

<!-- PROFILE -->
<section id="profile">
  <div class="card">
    <h3>Profile</h3>
    <p>User Area</p>
  </div>
</section>

<!-- BOTTOM NAV -->
<nav>
  <div onclick="showTab('dashboard')">🏠<br>Dashboard</div>
  <div onclick="showTab('ads')">📺<br>Ads</div>
  <div onclick="showTab('withdraw')">💸<br>Withdraw</div>
  <div onclick="showTab('profile')">👤<br>Profile</div>
</nav>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore, doc, getDoc, getDocs,
  updateDoc, increment, collection
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* 🔥 FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyCygxCD-LtbsfORwG4qnEE8Vy-v_0u1cG4",
  authDomain: "new-bdf18.firebaseapp.com",
  projectId: "new-bdf18"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ===== USER DATA ===== */
const userId = "public_user";
const today = new Date().toISOString().slice(0,10);
let balance = 0;
let adConfig = { enabled:false, zoneId:"", reward:0 };

/* ===== LOAD SETTINGS ===== */
async function loadSettings(){
  const adSnap = await getDoc(doc(db,"settings","ads"));
  if(adSnap.exists()) adConfig = adSnap.data();
}
loadSettings();

/* ===== LOAD TELEGRAM TASKS ===== */
async function loadTelegramTasks(){
  const box = document.getElementById("tgTasks");
  box.innerHTML = "";

  const snap = await getDocs(collection(db,"telegram_tasks"));
  snap.forEach(d=>{
    const t = d.data();
    if(!t.enabled) return;

    const div = document.createElement("div");
    div.style.marginBottom="12px";
    div.innerHTML = `
      <b>${t.title}</b><br>
      Reward: ${t.reward}<br>
      <button onclick="claimTask('${d.id}',${t.reward},'${t.link}')">
        Join & Claim
      </button>
    `;
    box.appendChild(div);
  });
}
loadTelegramTasks();

/* ===== CLAIM TELEGRAM TASK ===== */
window.claimTask = async function(taskId,reward,link){
  const userRef = doc(db,"users",userId);
  const limitSnap = await getDoc(doc(db,"settings","app"));

  const limit = limitSnap.exists()
    ? limitSnap.data().dailyTelegramLimit || 3
    : 3;

  const userSnap = await getDoc(userRef);
  let user = userSnap.exists()
    ? userSnap.data()
    : { tgCount:0, tgDate:today, completed_tasks:{} };

  if(user.tgDate !== today){
    user.tgCount = 0;
    user.tgDate = today;
  }

  if(user.tgCount >= limit){
    alert("Daily limit reached");
    return;
  }

  if(user.completed_tasks?.[taskId]){
    alert("Already completed");
    return;
  }

  window.open(link,"_blank");

  await updateDoc(userRef,{
    balance: increment(reward),
    tgCount: increment(1),
    tgDate: today,
    [`completed_tasks.${taskId}`]: true
  });

  balance += reward;
  document.getElementById("balance").innerText = balance.toFixed(2);
};
</script>

<script>
function showTab(id){
  document.querySelectorAll("section").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function watchAd(){
  if(!adConfig.enabled){
    alert("Ads disabled");
    return;
  }
  giga.show({ zoneId: adConfig.zoneId }).then(()=>{
    balance += Number(adConfig.reward || 0);
    document.getElementById("balance").innerText = balance.toFixed(2);
  });
}
</script>

<script src="https://giga.pub/sdk.js"></script>

</body>
</html>
